name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          mv /tmp/templates/templates/web_* "$templates/"
          mv /tmp/templates/templates/version.txt "$templates/"

      # GitHub Pages serves everything with max-age=600, so the .js/.wasm/.pck fetched by the page stay cached
      # after a deploy. Naming them after the commit makes every deploy load fresh files; only the HTML keeps
      # a fixed name, and browsers revalidate it on reload.
      - name: Export web build
        run: |
          name=pacmaze-${GITHUB_SHA::8}
          mkdir -p build/web
          ~/godot/godot --headless --path . --import
          ~/godot/godot --headless --path . --export-release "Web" build/web/$name.html
          mv build/web/$name.html build/web/index.html
          test -f build/web/$name.pck

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
