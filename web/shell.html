<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: black;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.25rem;
	visibility: hidden;
	transition: opacity 0.3s;
}

#status.done {
	opacity: 0;
}

/* The bar is padded by half a Pac-Man on each side so he never leaves the screen at 0% or 100%. */
#loader {
	--pac: 44px;
	position: relative;
	width: min(70vw, 480px);
	height: var(--pac);
	padding: 0 calc(var(--pac) / 2);
	box-sizing: border-box;
}

#loader-track {
	position: relative;
	height: 100%;
	/* Pellets waiting to be eaten ahead of Pac-Man. */
	background: radial-gradient(circle, #f4d9b0 3px, transparent 3.5px) left center / 22px 100% repeat-x;
}

#loader-fill {
	position: absolute;
	left: 0;
	top: 50%;
	width: 0;
	height: 12px;
	transform: translateY(-50%);
	border-radius: 6px 0 0 6px;
	background-color: #f1eb1f;
	box-shadow: 0 0 12px rgba(241, 235, 31, 0.45);
	transition: width 0.25s ease-out;
}

#loader-pac {
	position: absolute;
	left: 0;
	top: 50%;
	width: var(--pac);
	height: var(--pac);
	transform: translate(-50%, -50%);
	transition: left 0.25s ease-out;
}

#status-text {
	color: #b8b8b8;
	font: 14px/1 'Courier New', monospace;
	letter-spacing: 0.2em;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Seu navegador não suporta a tag canvas.
		</canvas>

		<noscript>
			Seu navegador não suporta JavaScript.
		</noscript>

		<div id="status">
			<div id="loader">
				<div id="loader-track">
					<div id="loader-fill"></div>
					<svg id="loader-pac" viewBox="0 0 256 256" aria-hidden="true">
						<path fill="#f1eb1f" d="M128 128 L231.92 68 A120 120 0 1 0 231.92 188 Z">
							<animate attributeName="d" dur="0.3s" repeatCount="indefinite"
								values="M128 128 L231.92 68 A120 120 0 1 0 231.92 188 Z;M128 128 L248 127 A120 120 0 1 0 248 129 Z;M128 128 L231.92 68 A120 120 0 1 0 231.92 188 Z"/>
						</path>
					</svg>
				</div>
			</div>
			<div id="status-text">CARREGANDO</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const loader = document.getElementById('loader');
	const loaderFill = document.getElementById('loader-fill');
	const loaderPac = document.getElementById('loader-pac');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setProgress(ratio) {
		const pct = Math.max(0, Math.min(1, ratio)) * 100;
		loaderFill.style.width = pct + '%';
		loaderPac.style.left = pct + '%';
		statusText.textContent = 'CARREGANDO ' + Math.floor(pct) + '%';
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			setProgress(1);
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 300);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loader.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Erro\nFaltam recursos do navegador necessários para rodar projetos Godot na Web:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		setProgress(0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					setProgress(current / total);
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
